name: mausbot-hindsight

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.10.3@sha256:b5da1a9aece1f53a15f12821fb1470f358ed6c74dfaa0c4b1a39c3f3ae93e002
    container_name: mausbot-hindsight
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: none
      HINDSIGHT_API_RETAIN_EXTRACTION_MODE: chunks
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: onnx
      HINDSIGHT_API_EMBEDDINGS_ONNX_MODEL_ID: intfloat/multilingual-e5-small
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_WORKER_MAX_SLOTS: "1"
      HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS: "0"
      HINDSIGHT_API_RETAIN_MAX_CONCURRENT: "1"
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
      HINDSIGHT_API_ENABLE_OBSERVATIONS: "false"
      HINDSIGHT_API_MCP_ENABLED: "false"
      HINDSIGHT_API_MODEL_INIT_TIMEOUT: "600"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /home/hindsight/.cache/huggingface
    volumes:
      - database:/home/hindsight/.pg0
      - models:/home/hindsight/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 10m
      retries: 4

volumes:
  database:
    name: mausbot-hindsight-data
  models:
    name: mausbot-hindsight-models
